[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-to-decision"
version = "0.1.0"
description = "Interpretable gas demand forecast, supply-plan optimisation, variance analysis and reporting"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "statsmodels",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "pulp",
    "openpyxl",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
